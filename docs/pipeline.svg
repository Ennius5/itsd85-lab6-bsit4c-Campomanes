<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <style>
      .col  { fill:#f3f3f3; stroke:#999; stroke-width:1.5; }
      .hdr  { font-size:22px; font-weight:bold; fill:#111; }
      .sub  { font-size:15px; fill:#444; }
      .box  { fill:#fff; stroke:#222; stroke-width:1.8; }
      .t    { font-size:18px; font-weight:bold; fill:#111; }
      .l    { font-size:15px; fill:#333; }
      .m    { font-size:15px; fill:#333; font-family:Consolas, "Courier New", monospace; }
      .ln   { stroke:#222; stroke-width:2; fill:none; marker-end:url(#arr); }
      .lbl  { font-size:15px; fill:#111; font-style:italic; }
      .note { font-size:14px; fill:#333; }
    </style>
  </defs>

  <!-- Columns -->
  <rect class="col" x="20"  y="20" width="380" height="820" rx="12"/>
  <rect class="col" x="440" y="20" width="500" height="820" rx="12"/>
  <rect class="col" x="980" y="20" width="500" height="820" rx="12"/>

  <text class="hdr" x="40"   y="58">Developer laptop</text>
  <text class="sub" x="40"   y="82">Windows · VS Code · Node.js 24 · Git</text>
  <text class="hdr" x="460"  y="58">GitHub (free, public repository)</text>
  <text class="sub" x="460"  y="82">Source of truth · GitHub Actions CI</text>
  <text class="hdr" x="1000" y="58">Deployment server</text>
  <text class="sub" x="1000" y="82">VMware VM · Ubuntu Server 26.04 LTS · Docker · no public IP</text>

  <!-- Laptop -->
  <rect class="box" x="45" y="120" width="330" height="100" rx="8"/>
  <text class="t" x="60" y="150">1  Write code and test locally</text>
  <text class="m" x="60" y="178">npm test</text>
  <text class="m" x="60" y="200">npm run lint</text>

  <rect class="box" x="45" y="290" width="330" height="100" rx="8"/>
  <text class="t" x="60" y="320">2  Push a branch</text>
  <text class="l" x="60" y="348">git push over SSH,</text>
  <text class="l" x="60" y="370">then open a pull request</text>

  <!-- GitHub -->
  <rect class="box" x="465" y="120" width="450" height="100" rx="8"/>
  <text class="t" x="480" y="150">3  Pull request into main</text>
  <text class="l" x="480" y="178">Ruleset protect-main: PR required,</text>
  <text class="l" x="480" y="200">required check “test”, no force pushes</text>

  <rect class="box" x="465" y="290" width="450" height="100" rx="8"/>
  <text class="t" x="480" y="320">4  test job (GitHub-hosted runner)</text>
  <text class="m" x="480" y="348">runs-on: ubuntu-latest</text>
  <text class="m" x="480" y="370">npm ci → npm run lint → npm test</text>

  <polygon class="box" points="690,425 800,480 690,535 580,480"/>
  <text class="t" x="690" y="486" text-anchor="middle">Tests pass?</text>

  <rect class="box" x="465" y="600" width="210" height="110" rx="8" stroke-dasharray="7 5" style="fill:#e4e4e4"/>
  <text class="t" x="480" y="630">✗ Merge blocked</text>
  <text class="l" x="480" y="658">Nothing is deployed;</text>
  <text class="l" x="480" y="680">server keeps the</text>
  <text class="l" x="480" y="700">old version</text>

  <rect class="box" x="705" y="600" width="210" height="110" rx="8"/>
  <text class="t" x="720" y="630">5  Merge to main</text>
  <text class="l" x="720" y="658">Push event queues the</text>
  <text class="m" x="720" y="680">deploy</text><text class="l" x="780" y="680">job</text>
  <text class="m" x="720" y="700">needs: test</text>

  <!-- Server -->
  <rect class="box" x="1005" y="120" width="450" height="100" rx="8"/>
  <text class="t" x="1020" y="150">6  Self-hosted runner (systemd service)</text>
  <text class="l" x="1020" y="178">itsd85-server · labels self-hosted, linux, deploy</text>
  <text class="l" x="1020" y="200">Polls GitHub for jobs over outbound HTTPS</text>

  <rect class="box" x="1005" y="290" width="450" height="100" rx="8"/>
  <text class="t" x="1020" y="320">7  deploy job: build and restart</text>
  <text class="m" x="1020" y="348">docker compose up -d --build</text>
  <text class="m" x="1020" y="370">image itsd85-app:&lt;commit SHA&gt;</text>

  <rect class="box" x="1005" y="460" width="450" height="100" rx="8"/>
  <text class="t" x="1020" y="490">8  Health check</text>
  <text class="m" x="1020" y="518">GET /health</text><text class="l" x="1118" y="518">must return the new</text>
  <text class="l" x="1020" y="540">commit SHA within 15 tries, else the job fails</text>

  <rect class="box" x="1005" y="630" width="450" height="100" rx="8" style="stroke-width:4"/>
  <text class="t" x="1020" y="660">9  App is live</text>
  <text class="m" x="1020" y="688">http://&lt;vm-ip&gt;:8080</text>
  <text class="l" x="1020" y="710">Home page and /health show the commit ID</text>

  <rect x="1005" y="755" width="450" height="62" rx="8" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="note" x="1020" y="780">Rollback: older SHA-tagged images stay on the server.</text>
  <text class="note" x="1020" y="802">Emergency: compose up --no-build (≈12 s); then git revert.</text>

  <!-- Arrows -->
  <path class="ln" d="M210,220 L210,288"/>
  <path class="ln" d="M375,340 L420,340 L420,170 L463,170"/>
  <path class="ln" d="M690,220 L690,288"/>
  <path class="ln" d="M690,390 L690,423"/>
  <path class="ln" d="M610,520 L570,598"/>
  <text class="lbl" x="560" y="560">no</text>
  <path class="ln" d="M770,520 L810,598"/>
  <text class="lbl" x="805" y="560">yes</text>
  <path class="ln" d="M465,655 L210,655 L210,392"/>
  <text class="lbl" x="225" y="645">fix the code and push again</text>
  <path class="ln" d="M915,655 L960,655 L960,170 L1003,170"/>
  <text class="lbl" x="966" y="420" text-anchor="middle" transform="rotate(90 966 420)">job picked up by the runner</text>
  <path class="ln" d="M1230,220 L1230,288"/>
  <path class="ln" d="M1230,390 L1230,458"/>
  <path class="ln" d="M1230,560 L1230,628"/>
</svg>
